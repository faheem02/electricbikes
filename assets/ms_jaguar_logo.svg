<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="160" height="66">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF6D"/>
      <stop offset="50%" stop-color="#DAA520"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCE881"/>
      <stop offset="100%" stop-color="#C59616"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B3A6B"/>
      <stop offset="100%" stop-color="#0F2042"/>
    </linearGradient>
  </defs>
  
  <!-- Running Cheetah / Leopard on top -->
  <g transform="translate(112, 4) scale(0.65)" fill="url(#goldGrad)">
    <!-- Cheetah Body & Legs in leaping pose -->
    <path d="M-2,14 C0,11 6,8 14,7 C20,6 26,4 32,7 C36,9 38,13 37,16 C34,18 29,18 25,18 C20,18 16,19 12,20 C8,21 3,21 -2,22 Z"/>
    <path d="M34,8 C36,6 38,5 42,6 C44,7 45,9 43,11 C40,12 37,11 34,9 Z"/>
    <!-- Head & Ears -->
    <circle cx="43" cy="8" r="3.5"/>
    <path d="M43,5 L45,2 L47,5 Z"/>
    <!-- Front Legs outstretched -->
    <path d="M33,13 C38,15 45,18 50,19 C52,19.5 50,21 47,20.5 C43,19.5 37,17 32,15 Z"/>
    <path d="M30,15 C34,18 41,23 44,25 C45,26 43,27 41,26 C38,24 33,20 29,17 Z"/>
    <!-- Back Legs trailing -->
    <path d="M5,17 C-1,21 -8,25 -14,27 C-16,27.5 -15,25.5 -13,24.5 C-8,22 -2,19 4,16 Z"/>
    <path d="M8,18 C3,23 -4,29 -10,32 C-12,33 -11,31 -9,29.5 C-4,26 2,21 7,17 Z"/>
    <!-- Tail curved upwards -->
    <path d="M-1,14 C-6,11 -11,6 -13,0 C-13,-2 -11,-2 -11,0 C-9,5 -5,9 1,12 Z" stroke="url(#goldGrad)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Left Spread Golden Wings -->
  <g fill="url(#goldLight)" stroke="#996515" stroke-width="0.5">
    <!-- Top Feather -->
    <polygon points="100,24 15,23 0,27 100,31"/>
    <!-- 2nd Tier -->
    <polygon points="100,30 25,31 12,36 100,38"/>
    <!-- 3rd Tier -->
    <polygon points="100,37 38,38 26,44 100,45"/>
    <!-- 4th Tier -->
    <polygon points="100,44 52,45 42,51 100,51"/>
    <!-- 5th Tier -->
    <polygon points="100,50 68,52 60,57 100,56"/>
  </g>

  <!-- Right Spread Golden Wings -->
  <g fill="url(#goldLight)" stroke="#996515" stroke-width="0.5">
    <!-- Top Feather -->
    <polygon points="140,24 225,23 240,27 140,31"/>
    <!-- 2nd Tier -->
    <polygon points="140,30 215,31 228,36 140,38"/>
    <!-- 3rd Tier -->
    <polygon points="140,37 202,38 214,44 140,45"/>
    <!-- 4th Tier -->
    <polygon points="140,44 188,45 198,51 140,51"/>
    <!-- 5th Tier -->
    <polygon points="140,50 172,52 180,57 140,56"/>
  </g>

  <!-- Central "MS" Badge -->
  <rect x="94" y="22" width="52" height="34" rx="3" fill="url(#blueGrad)" stroke="#DAA520" stroke-width="1.2"/>
  <text x="120" y="48" font-family="'Arial Black', 'Impact', sans-serif" font-size="25" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">MS</text>
  
  <!-- "JAGUAR" Text -->
  <text x="120" y="73" font-family="'Arial Black', 'Impact', 'Montserrat', sans-serif" font-size="18" font-weight="900" fill="url(#goldGrad)" stroke="#8A6208" stroke-width="0.5" text-anchor="middle" letter-spacing="2">JAGUAR</text>

  <!-- "AUTHORIZED DEALER" Text -->
  <text x="120" y="89" font-family="'Arial', 'Helvetica', sans-serif" font-size="10.5" font-weight="800" fill="#111111" text-anchor="middle" letter-spacing="0.8">AUTHORIZED DEALER</text>
</svg>
